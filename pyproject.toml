[project]
name = "tlv"
version = "0.2.0"
description = "Local video understanding for terminal agents: index, entities, verified clip search"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=1.10",
  "mlx>=0.29",
  "mlx-embeddings>=0.0.5",
  "mlx-vlm>=0.7.6",
  "mlx-whisper>=0.4.2",
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "opencv-python-headless>=4.10",
  "pillow>=11.0",
  "scipy>=1.14",
  "yt-dlp>=2026.1.1",
]

[project.scripts]
tlv = "tlv.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tlv"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
